name: Question
description: Ask about usage or unclear documentation
title: '[Question] '
body:
- type: markdown
  attributes:
    value: 'English or Chinese responses are welcome. Use a specific title and keep one topic per issue.


      Search existing issues first. Remove credentials, private paths and private project content; include
      only the smallest relevant excerpt.


      Submitting through an agent, CLI or API? Follow the same headings in [the issue guide](https://github.com/LemonCANDY42/codex-balanced-agents/blob/main/docs/issues.md).
      Mark unknown facts explicitly; do not invent results.'
- type: textarea
  id: question
  attributes:
    label: Question and goal
    description: What are you trying to do, and what is unclear?
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Relevant context
    description: Link the doc or role; include preset and client/version if relevant. Write unknown or
      not applicable where needed.
  validations:
    required: true
- type: textarea
  id: attempts
  attributes:
    label: What you checked or tried
    description: Relevant docs, existing issues or a minimal sanitized example; say if you have not tried
      anything yet.
  validations:
    required: true
