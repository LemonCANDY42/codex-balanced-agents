name: Bug report
description: Report an installation or role behavior problem
title: '[Bug] '
body:
- type: markdown
  attributes:
    value: 'English or Chinese responses are welcome. Use a specific title and keep one topic per issue.


      Search existing issues first. Remove credentials, private paths and private project content; include
      only the smallest relevant excerpt.


      Submitting through an agent, CLI or API? Follow the same headings in [the issue guide](https://github.com/LemonCANDY42/codex-balanced-agents/blob/main/docs/issues.md).
      Mark unknown facts explicitly; do not invent results.'
- type: textarea
  id: summary
  attributes:
    label: Problem
    description: What failed and how does it affect your task?
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: OS; Codex app or CLI and version; repository commit or download date; Quality/Balanced;
      affected role/model/effort. Include Python version for installer issues. Write unknown where needed;
      omit private paths.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Numbered steps, minimal command or sanitized prompt, and relevant customization. If intermittent
      or not reproducible, say so and describe when it occurred.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: What should happen? Link the relevant documentation if available.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior and evidence
    description: What did you observe? Include a minimal redacted error/output or screenshot if available.
      Separate observations from suspected causes; do not paste full session logs.
  validations:
    required: true
- type: textarea
  id: workaround
  attributes:
    label: Workaround
    description: What have you tried, and what happened?
  validations:
    required: false
