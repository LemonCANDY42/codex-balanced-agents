name: Improvement
description: Suggest a focused change to roles, installation or docs
title: '[Idea] '
body:
- type: markdown
  attributes:
    value: 'English or Chinese responses are welcome. Use a specific title and keep one topic per issue.


      Search existing issues first. Remove credentials, private paths and private project content; include
      only the smallest relevant excerpt.


      Submitting through an agent, CLI or API? Follow the same headings in [the issue guide](https://github.com/LemonCANDY42/codex-balanced-agents/blob/main/docs/issues.md).
      Mark unknown facts explicitly; do not invent results.'
- type: textarea
  id: need
  attributes:
    label: Use case and problem
    description: Describe a concrete task and the limitation you encountered.
  validations:
    required: true
- type: textarea
  id: outcome
  attributes:
    label: Desired outcome
    description: What should become possible or clearer?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Suggested change
    description: 'Describe the smallest useful change. A solution is optional: write "unsure" if you only
      know the problem.'
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance example
    description: Give a concrete example showing the improvement works.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives and tradeoffs
    description: Existing approaches tried, related issues, compatibility concerns or extra setup cost.
  validations:
    required: false
